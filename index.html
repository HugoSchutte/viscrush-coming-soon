<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Viscrush | Coming Soon</title>
  <meta name="description" content="Viscrush — Something new is taking shape.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #FFFFFF;
      color: #3D4147;
      font-family: Arial, Helvetica, sans-serif;
    }

    .coming-soon {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .content {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      display: block;
      width: min(760px, 82vw);
      height: auto;
      margin: 0 auto 42px;
    }

    .message {
      color: #3D4147;
      font-size: clamp(18px, 2vw, 27px);
      font-weight: 300;
      line-height: 1.5;
      letter-spacing: 0.08em;
      margin-bottom: 28px;
    }

    .coming {
      color: #A5D81A;
      font-size: clamp(13px, 1.3vw, 17px);
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      padding-left: 0.35em;
    }

    @media (max-width: 600px) {
      .coming-soon {
        padding: 30px 20px;
      }

      .logo {
        width: min(92vw, 560px);
        margin-bottom: 32px;
      }

      .message {
        font-size: 17px;
        line-height: 1.6;
        letter-spacing: 0.05em;
        margin-bottom: 24px;
      }

      .coming {
        font-size: 12px;
        letter-spacing: 0.28em;
        padding-left: 0.28em;
      }
    }
  </style>
</head>

<body>

  <main class="coming-soon">
    <div class="content">

      <img
        class="logo"
        src="viscrush%20logo.svg"
        alt="Viscrush"
      >

      <p class="message">
        Something new is taking shape.
      </p>

      <p class="coming">
        Coming Soon
      </p>

    </div>
  </main>

</body>
</html>
