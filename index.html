<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Viscrush | Coming Soon</title>
  <meta name="description" content="Viscrush — Something new is taking shape.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #3D4147;
      color: #FFFFFF;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .coming-soon {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .content {
      width: 100%;
      max-width: 1000px;
    }

    .brand {
      font-size: clamp(58px, 10vw, 130px);
      line-height: 0.9;
      font-weight: 800;
      letter-spacing: -0.045em;
      text-transform: uppercase;
      margin-bottom: 38px;
    }

    .brand .vis {
      color: #FFFFFF;
    }

    .brand .crush {
      color: #A5D81A;
    }

    .message {
      font-size: clamp(18px, 2.2vw, 28px);
      font-weight: 300;
      letter-spacing: 0.08em;
      margin-bottom: 28px;
    }

    .coming {
      color: #A5D81A;
      font-size: clamp(13px, 1.4vw, 17px);
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      padding-left: 0.35em;
    }

    @media (max-width: 600px) {
      .coming-soon {
        padding: 30px 20px;
      }

      .brand {
        margin-bottom: 28px;
      }

      .message {
        line-height: 1.5;
        margin-bottom: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="coming-soon">
    <div class="content">

      <h1 class="brand">
        <span class="vis">VIS</span><span class="crush">CRUSH</span>
      </h1>

      <p class="message">
        Something new is taking shape.
      </p>

      <p class="coming">
        Coming Soon
      </p>

    </div>
  </main>

</body>
</html>
